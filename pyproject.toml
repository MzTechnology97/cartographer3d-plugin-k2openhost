[project]
name = "cartographer3d-plugin"
requires-python = ">=3.8, <4"
license = { file = "LICENSE" }
dependencies = ["typing-extensions~=4.12"]
keywords = ["klipper", "kalico", "3D printing", "cartographer", "creality k2"]
classifiers = [
  "Development Status :: 3 - Alpha",

  "Intended Audience :: End Users/Desktop",

  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
description = "K2-OpenHost Cartographer3D integration for external Klipper/Kalico hosts"
dynamic = ["version"]

[project.urls]
homepage = "https://cartographer3d.com/"
repository = "https://github.com/MzTechnology97/cartographer3d-plugin-k2openhost"
upstream = "https://github.com/Cartographer3D/cartographer3d-plugin"

[project.optional-dependencies]
scipy = ["scipy~=1.9"]

[dependency-groups]
test = [
  "pytest~=8.3",
  "pytest-mock~=3.14",
]
lint = ["ruff~=0.14"]
typecheck = [
  "basedpyright~=1.27",
  "hatchling~=1.27",
  "scipy-stubs~=1.15 ; python_version~='3.10'",
]
dev = ["numpy~=1.16"]
scripts = ["matplotlib>=3.7.5; python_version~='3.9'"]

[tool.pyright]
pythonVersion = "3.8"
venvPath = "./"
venv = ".venv"
allowedUntypedLibraries = ["numpy.polynomial"]
reportMissingModuleSource = false              # klippy imports are always missing sources
reportMissingTypeStubs = true
reportAny = false                              # Consider if we can get rid of this
reportImplicitStringConcatenation = false      # Handled by ruff

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.uv]
default-groups = ["test", "lint", "typecheck", "scripts"]

[tool.hatch.version]
source = "vcs"
# TestPyPi does not support local version identifiers
raw-options.local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/cartographer/__version__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.jj", "/docs"]
[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]

[tool.hatch.build.targets.wheel.hooks.custom]

[build-system]
requires = ["hatchling", "hatch-vcs", "typing-extensions"]
build-backend = "hatchling.build"

[tool.hatch.envs.hatch-static-analysis]
config-path = "none"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.13", "3.12", "3.11", "3.10", "3.9", "3.8"]
