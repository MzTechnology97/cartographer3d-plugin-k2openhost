# K2-OpenHost Cartographer updater for Moonraker / Mainsail.
# Copy this section into moonraker.conf, or include a copy of this file from
# ~/printer_data/config.

[update_manager cartographer]
type: git_repo
channel: dev
path: ~/cartographer3d-plugin-k2openhost
origin: https://github.com/MzTechnology97/cartographer3d-plugin-k2openhost.git
primary_branch: main
virtualenv: ~/klippy-env
requirements: requirements.txt
is_system_service: False
managed_services: klipper
info_tags:
  desc=Cartographer3D Plugin - K2-OpenHost
